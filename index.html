<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Cập Nhật Hệ Thống</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #f8fafc;
            overflow: hidden;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 440px;
            width: 90%;
            position: relative;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .icon-container {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 18px;
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .icon-container i {
            font-size: 28px;
            color: #fff;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        p {
            color: #94a3b8;
            font-size: 13.5px;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .badge-old {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .badge-new {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .notice-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px dashed rgba(245, 158, 11, 0.4);
            padding: 10px 14px;
            border-radius: 10px;
            color: #fbbf24;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .notice-box i {
            font-size: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            padding: 13px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14.5px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(99, 102, 241, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .footer span {
            color: #a855f7;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h2>Thông Báo Hệ Thống</h2>
        <p>
            Phiên bản <span class="badge-old">v1</span> đã ngừng hoạt động.<br>
            Vui lòng lấy key mới qua phiên bản <span class="badge-new">v3</span> để tiếp tục sử dụng dịch vụ.
        </p>
        
        <div class="notice-box">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>Lưu ý: Bạn cần tải tool v3 mới có thể sử dụng key này!</span>
        </div>

        <a href="https://rutnganlink.page.gd/?i=1" class="btn" target="_blank">
            <i class="fa-solid fa-key"></i> Lấy Key v3 Ngay
        </a>
        <div class="footer">
            Designed by <span>htool</span>
        </div>
    </div>

</body>
</html>
