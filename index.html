<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key Hôm Nay - Hung Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow-x: hidden;
      position: relative;
    }

    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 35px 40px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 480px;
      width: 90%;
      animation: floatIn 1.2s ease-out;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h2 {
      font-size: 28px;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #00dbde, #fc00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 219, 222, 0.3);
    }

    /* Khu vực nhập mã thiết bị */
    .input-group {
      margin: 20px 0;
      text-align: left;
    }

    .input-group label {
      font-size: 13px;
      color: #00dbde;
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      border-color: #fc00ff;
      box-shadow: 0 0 10px rgba(252, 0, 255, 0.3);
    }

    /* Bảng Terminal Load giả lập */
    .terminal-box {
      display: none;
      background: #050515;
      border: 1px solid #00dbde;
      border-radius: 12px;
      padding: 15px;
      margin: 20px 0;
      text-align: left;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: #00ffcc;
      max-height: 180px;
      overflow-y: auto;
      box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.2);
    }

    .terminal-line {
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid transparent;
    }

    /* Khu vực kết quả hiển thị Key */
    .result-section {
      display: none;
    }

    .key {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      margin: 20px 0;
      padding: 15px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      letter-spacing: 2px;
      word-break: break-all;
      animation: neonPulse 2s infinite alternate;
    }

    @keyframes neonPulse {
      from { text-shadow: 0 0 10px #00dbde, 0 0 20px #00dbde; border: 1px solid rgba(0, 219, 222, 0.5); }
      to { text-shadow: 0 0 15px #00dbde, 0 0 25px #fc00ff; border: 1px solid rgba(252, 0, 255, 0.5); }
    }

    .expiry {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 20px;
    }

    /* Hệ thống Button điều hướng */
    .btn-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    button {
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      background: linear-gradient(45deg, #00dbde, #fc00ff);
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(252, 0, 255, 0.3);
    }

    button:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .footer {
      position: relative;
      z-index: 2;
      margin-top: 30px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
      line-height: 1.6;
    }

    audio { display: none; }
  </style>
</head>
<body>

  <div id="particles-js"></div>

  <div class="container">
    <h2>Key Hôm Nay</h2>
    
    <div id="authSection">
      <div class="input-group">
        <label for="deviceId">Vui lòng nhập Mã thiết bị (Device ID):</label>
        <input type="text" id="deviceId" placeholder="Ví dụ: HTOOL-113.161-X7Z..." autocomplete="off">
      </div>
      <button onclick="startVerification()" id="verifyBtn">Kiểm Tra Thiết Bị</button>
    </div>

    <div class="terminal-box" id="terminalBox"></div>

    <div class="result-section" id="resultSection">
      <div class="key" id="keyDisplay">Đang đồng bộ...</div>
      <div class="expiry" id="expiryTime">Đang tính thời gian...</div>
      <div class="btn-container">
        <button onclick="copyKey()">Copy Key</button>
        <button onclick="toggleMusic()" id="musicBtn">Phát Nhạc</button>
      </div>
    </div>
  </div>

  <div class="footer">
    Bản quyền: Hung Tool ┃ Zalo: 0398639736<br>
    Phiên bản: V4.5 - Premium Terminal Design
  </div>

  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS('particles-js', {
      "particles": {
        "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
        "color": { "value": "#ffffff" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.4, "random": true },
        "size": { "value": 2.5, "random": true },
        "line_linked": { "enable": true, "distance": 140, "color": "#00dbde", "opacity": 0.15, "width": 1 },
        "move": { "enable": true, "speed": 1.5, "direction": "none", "random": false }
      },
      "interactivity": { "detect_on": "canvas", "events": { "onhover": { "enable": true, "mode": "repulse" }, "resize": true } },
      "retina_detect": true
    });
  </script>

  <script>
    // Phân tách lấy chuỗi Key từ URL truyền vào (?key=...)
    const urlParams = new URLSearchParams(window.location.search);
    const secretKey = urlParams.get('key') || 'H-TOOL-FREE-KEY-999';

    // Thiết lập đếm ngược thời gian hết hạn (Mặc định 5 tiếng)
    const createdAt = new Date();
    const expiryDate = new Date(createdAt.getTime() + 5 * 60 * 60 * 1000);

    function updateExpiryCountdown() {
      const now = new Date();
      const remaining = expiryDate - now;
      if (remaining <= 0) {
        document.getElementById("expiryTime").textContent = "Mã khóa Key này đã hết hạn sử dụng!";
        return;
      }
      const hours = Math.floor((remaining / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((remaining / (1000 * 60)) % 60);
      const seconds = Math.floor((remaining / 1000) % 60);
      document.getElementById("expiryTime").textContent = `Thời hạn khóa key còn lại: ${hours}h ${minutes}p ${seconds}s`;
    }

    // 10 dòng mã hóa Terminal chạy giả lập chuyên nghiệp
    const terminalLogs = [
      "[⚙️] Khởi tạo giao thức kiểm tra ID phần cứng...",
      "[📡] Đang gửi gói tin ánh xạ địa chỉ IP thiết bị lên Cloud Server...",
      "[🔒] Đang kết nối tới DB: keys_database (JSONBIN Server)...",
      "[🔄] Đang đối soát mã định danh thiết bị với cấu trúc liên kết...",
      "[🔍] Đang phân tích trạng thái link: STATUS = 'unused'...",
      "[📊] Đang đồng bộ hóa luồng dữ liệu bảo mật mã nguồn cấp cao...",
      "[🛡️] Kích hoạt tường lửa Anti-Bypass, chặn đứng Proxy/Fiddler...",
      "[🧬] Giao thức mã hóa Base64 & MD5 hoàn tất 100%...",
      "[✓] Khớp thiết bị thành công! Cấp phép mở khóa quyền truy cập...",
      "[🚀] HOÀN TẤT! Đang giải mã khóa Key hiển thị lên màn hình..."
    ];

    function startVerification() {
      const devIdInput = document.getElementById("deviceId").value.trim();
      
      if (!devIdInput) {
        alert("Sếp ơi, vui lòng nhập chính xác Mã thiết bị trên Tool vào ô trống nhé!");
        return;
      }

      // Khóa nút bấm và ẩn ô nhập liệu
      document.getElementById("verifyBtn").disabled = true;
      document.getElementById("deviceId").disabled = true;
      
      const terminalBox = document.getElementById("terminalBox");
      terminalBox.style.display = "block";
      
      let currentLine = 0;

      // Hàm in từng dòng trong bảng terminal chạy đệ quy lặp lại đủ 10 dòng
      function printNextLine() {
        if (currentLine < terminalLogs.length) {
          const lineEl = document.createElement("div");
          lineEl.className = "terminal-line";
          lineEl.textContent = terminalLogs[currentLine];
          terminalBox.appendChild(lineEl);
          
          // Tự động cuộn bảng terminal xuống dòng mới nhất
          terminalBox.scrollTop = terminalBox.scrollHeight;
          
          currentLine++;
          // Thời gian delay ngẫu nhiên giữa các dòng chạy cho thật (từ 300ms đến 600ms)
          setTimeout(printNextLine, Math.random() * 300 + 300);
        } else {
          // Khi chạy xong hoàn tất cả 10 dòng terminal
          setTimeout(() => {
            // Ẩn khu vực nhập liệu và bảng terminal đi
            document.getElementById("authSection").style.display = "none";
            terminalBox.style.style = "none"; 
            terminalBox.style.display = "none";
            
            // Đẩy giá trị key thực tế vào ô nhận diện và kích hoạt bộ hiển thị
            document.getElementById("keyDisplay").textContent = secretKey;
            document.getElementById("resultSection").style.display = "block";
            
            // Kích hoạt đồng hồ đếm ngược
            updateExpiryCountdown();
            setInterval(updateExpiryCountdown, 1000);
          }, 600);
        }
      }

      // Bắt đầu kích hoạt luồng dòng đầu tiên
      printNextLine();
    }

    function copyKey() {
      navigator.clipboard.writeText(secretKey);
      alert("Đã sao chép mã Key thành công vào khay nhớ tạm!");
    }

    // Trình quản lý điều khiển phát nhạc nền
    const music = document.getElementById("bgMusic");
    const musicBtn = document.getElementById("musicBtn");
    let isPlaying = false;

    function toggleMusic() {
      if (isPlaying) {
        music.pause();
        musicBtn.textContent = "Phát Nhạc";
      } else {
        music.play().catch(err => console.log("Trình duyệt chặn tự động phát nhạc"));
        musicBtn.textContent = "Dừng Nhạc";
      }
      isPlaying = !isPlaying;
    }
  </script>

</body>
</html>
