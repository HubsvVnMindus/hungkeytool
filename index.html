<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key Hôm Nay - H-TOOL TERMINAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #050505; color: #00ff41; font-family: 'Fira Code', monospace; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { background: #0a0a0a; border: 1px solid #00ff41; padding: 40px; border-radius: 15px; box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); text-align: center; max-width: 480px; width: 90%; }
    input { width: 100%; padding: 12px; background: #000; border: 1px solid #00ff41; border-radius: 5px; color: #00ff41; margin-bottom: 15px; box-sizing: border-box; outline: none; }
    button { padding: 12px 30px; background: #00ff41; color: #000; border: none; border-radius: 5px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
    .terminal-box { display: none; background: #000; border: 1px solid #00ff41; padding: 15px; margin: 20px 0; text-align: left; font-size: 13px; max-height: 250px; overflow-y: hidden; position: relative; }
    .terminal-box::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 255, 65, 0.05) 50%); background-size: 100% 4px; pointer-events: none; }
    .terminal-line { margin-bottom: 5px; }
    .result-section { display: none; margin-top: 20px; }
    .key { font-size: 20px; font-weight: bold; padding: 15px; border: 1px dashed #00ff41; margin: 15px 0; color: #fff; word-break: break-all; }
  </style>
</head>
<body>

  <div class="container">
    <h2>H-TOOL TERMINAL</h2>
    <div id="authSection">
      <input type="text" id="deviceId" placeholder="Nhập Mã thiết bị (Device ID)...">
      <button onclick="startVerification()" id="verifyBtn">Kiểm Tra Thiết Bị</button>
    </div>
    <div class="terminal-box" id="terminalBox"></div>
    <div class="result-section" id="resultSection">
      <div>KEY CỦA SẾP:</div>
      <div class="key" id="keyDisplay">...</div>
      <button onclick="copyKey()">COPY KEY</button>
    </div>
  </div>

  <script>
    const secretKey = new URLSearchParams(window.location.search).get('key') || 'HTOOL-2026-VIP-999';

    async function startVerification() {
      const devId = document.getElementById("deviceId").value.trim();
      if (!devId) { alert("Sếp ơi, nhập ID vào nhé!"); return; }

      document.getElementById("authSection").style.display = "none";
      const terminalBox = document.getElementById("terminalBox");
      terminalBox.style.display = "block";

      // 1. Log khởi đầu
      const initialLogs = ["> Đang kết nối Server...", "> Kiểm tra trạng thái thiết bị..."];
      for (let log of initialLogs) {
        const line = document.createElement("div");
        line.className = "terminal-line";
        line.textContent = log;
        terminalBox.appendChild(line);
        await new Promise(r => setTimeout(r, 1000));
      }

      try {
        // 2. Gọi API JSONBin kiểm tra BAN
        const response = await fetch('https://api.jsonbin.io/v3/b/6a17d97221f9ee59d294044f/latest');
        const data = await response.json();
        
        if (data.record.bannedList.includes(devId)) {
          const banLine = document.createElement("div");
          banLine.style.color = "red";
          banLine.textContent = "[!] CẢNH BÁO: Thiết bị " + devId + " đã bị BAN!";
          terminalBox.appendChild(banLine);
          await new Promise(r => setTimeout(r, 2000));
          terminalBox.style.display = "none";
          document.getElementById("keyDisplay").innerHTML = "<span style='color:red'>BẠN ĐÃ BỊ BAN</span>";
          document.getElementById("resultSection").style.display = "block";
        } else {
          // 3. Log thành công (Delay 5s mỗi dòng)
          const normalLogs = [
            "> Đang kích hoạt key...",
            "> Key đã được kích hoạt...",
            "> Key hoạt động trên: " + devId + "...",
            "> Đồng bộ dữ liệu thành công...",
            "> [✓] Đã cấp quyền truy cập!"
          ];
          for (let log of normalLogs) {
            const line = document.createElement("div");
            line.className = "terminal-line";
            terminalBox.appendChild(line);
            for (let char of log) {
              line.textContent += char;
              await new Promise(r => setTimeout(r, 20));
            }
            await new Promise(r => setTimeout(r, 5000));
          }
          terminalBox.style.display = "none";
          document.getElementById("keyDisplay").textContent = secretKey;
          document.getElementById("resultSection").style.display = "block";
        }
      } catch (err) {
        alert("Lỗi kết nối Server!");
      }
    }

    function copyKey() {
      navigator.clipboard.writeText(secretKey);
      alert("Đã copy key!");
    }
  </script>
</body>
</html>
