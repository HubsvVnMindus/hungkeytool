<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key Hôm Nay - H-TOOL TERMINAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Reset & Nền */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: #050505;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #00ff41;
      overflow-x: hidden;
    }

    .container {
      background: #0a0a0a;
      border: 1px solid #00ff41;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
      text-align: center;
      max-width: 480px;
      width: 90%;
    }

    h2 { font-family: 'Fira Code', monospace; margin-bottom: 25px; text-shadow: 0 0 10px #00ff41; }

    input {
      width: 100%;
      padding: 12px;
      background: #000;
      border: 1px solid #00ff41;
      border-radius: 5px;
      color: #00ff41;
      font-family: 'Fira Code', monospace;
      margin-bottom: 15px;
      outline: none;
      box-sizing: border-box;
    }

    button {
      padding: 12px 30px;
      background: #00ff41;
      color: #000;
      border: none;
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      font-family: 'Fira Code', monospace;
    }

    button:hover { background: #00cc33; }

    /* Terminal Box */
    .terminal-box {
      display: none;
      background: #000;
      border: 1px solid #00ff41;
      padding: 15px;
      margin: 20px 0;
      text-align: left;
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      max-height: 250px;
      overflow-y: hidden;
      position: relative;
    }

    /* Hiệu ứng quét màn hình */
    .terminal-box::after {
      content: "";
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 255, 65, 0.05) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }

    .terminal-line { margin-bottom: 5px; }

    .result-section { display: none; margin-top: 20px; }
    .key { font-size: 20px; font-weight: bold; padding: 15px; border: 1px dashed #00ff41; margin: 15px 0; color: #fff; word-break: break-all; }
  </style>
</head>
<body>

  <div class="container">
    <h2>H-TOOL TERMINAL</h2>
    
    <div id="authSection">
      <input type="text" id="deviceId" placeholder="Nhập Mã thiết bị (Device ID)...">
      <button onclick="startVerification()" id="verifyBtn">Kiểm Tra Thiết Bị</button>
    </div>

    <div class="terminal-box" id="terminalBox"></div>

    <div class="result-section" id="resultSection">
      <div style="font-size: 14px;">KEY CỦA SẾP:</div>
      <div class="key" id="keyDisplay">...</div>
      <button onclick="copyKey()">COPY KEY</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const secretKey = urlParams.get('key') || 'HTOOL-2026-VIP-999';

    async function startVerification() {
      const devId = document.getElementById("deviceId").value;
      if (!devId) { alert("Sếp ơi, chưa nhập mã thiết bị kìa!"); return; }

      document.getElementById("authSection").style.display = "none";
      const terminalBox = document.getElementById("terminalBox");
      terminalBox.style.display = "block";

      const terminalLogs = [
        "> Khởi tạo giao thức kết nối...",
        "> Đang ánh xạ ID thiết bị...",
        "> Kiểm tra Database Server...",
        "> Phân tích trạng thái mã...",
        "> Đang kích hoạt key...",
        "> Key đã được kích hoạt...",
        "> Key hoạt động trên: " + devId + "...",
        "> Đồng bộ dữ liệu thành công...",
        "> [✓] Đã cấp quyền truy cập!",
        "> Giải mã hoàn tất..."
      ];

      for (let log of terminalLogs) {
        const line = document.createElement("div");
        line.className = "terminal-line";
        terminalBox.appendChild(line);
        
        // Hiệu ứng gõ chữ
        for (let char of log) {
          line.textContent += char;
          await new Promise(r => setTimeout(r, 25)); // Tốc độ gõ
        }
        await new Promise(r => setTimeout(r, 300));
      }

      // Hiện kết quả
      terminalBox.style.display = "none";
      document.getElementById("keyDisplay").textContent = secretKey;
      document.getElementById("resultSection").style.display = "block";
    }

    function copyKey() {
      navigator.clipboard.writeText(secretKey);
      alert("Đã copy key thành công!");
    }
  </script>
</body>
</html>
