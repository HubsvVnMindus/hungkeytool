<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Orbitron";
      src: url("./Orbitron.ttf") format("truetype");
      font-weight: 400 900;
      font-style: normal;
    }
    html, body {
      margin: 0;
      width: 1792px;
      height: 1008px;
      overflow: hidden;
      background: #07040A;
    }
    .stage {
      position: relative;
      width: 1792px;
      height: 1008px;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 1792px;
      height: 1008px;
      object-fit: cover;
    }
    .veil {
      position: absolute;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      width: 1180px;
      height: 460px;
      background: radial-gradient(
        ellipse at center,
        rgba(7, 4, 10, 0.88) 0%,
        rgba(7, 4, 10, 0.72) 42%,
        rgba(7, 4, 10, 0.28) 68%,
        rgba(7, 4, 10, 0) 78%
      );
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      width: 1040px;
      text-align: center;
    }
    .brackets {
      position: absolute;
      inset: -28px -36px;
      border: 1px solid rgba(255, 43, 214, 0.45);
      box-shadow:
        0 0 18px rgba(255, 43, 214, 0.25),
        inset 0 0 28px rgba(255, 27, 77, 0.12);
      pointer-events: none;
    }
    .brackets:before,
    .brackets:after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      border: 2px solid #FF1B4D;
    }
    .brackets:before {
      top: -2px;
      left: -2px;
      border-right: 0;
      border-bottom: 0;
    }
    .brackets:after {
      right: -2px;
      bottom: -2px;
      border-left: 0;
      border-top: 0;
    }
    .line {
      font-family: "Orbitron", sans-serif;
      font-weight: 800;
      line-height: 0.92;
      text-transform: none;
      background: linear-gradient(
        180deg,
        #ffe4ea 0%,
        #ff8aa0 18%,
        #FF1B4D 38%,
        #7a081c 58%,
        #ff6a86 76%,
        #2a0108 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter:
        drop-shadow(0 0 10px rgba(255, 27, 77, 0.9))
        drop-shadow(0 10px 22px rgba(255, 27, 77, 0.4));
    }
    .line1 {
      font-size: 118px;
      letter-spacing: 0.12em;
      padding-left: 0.12em;
    }
    .line2 {
      font-size: 156px;
      letter-spacing: 0.16em;
      padding-left: 0.16em;
      margin-top: 6px;
    }
    .rule {
      width: 380px;
      height: 2px;
      margin: 22px auto 0;
      background: linear-gradient(
        90deg,
        transparent,
        #ff2bd6 20%,
        #FF1B4D 50%,
        #ff2bd6 80%,
        transparent
      );
      box-shadow: 0 0 10px #ff2bd6;
    }
  </style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="./og-base.jpg" alt="" />
    <div class="veil"></div>
    <div class="lockup">
      <div class="brackets"></div>
      <div class="line line1">TST-TOOL</div>
      <div class="line line2">XWORLD</div>
      <div class="rule"></div>
    </div>
  </div>
</body>
</html>
